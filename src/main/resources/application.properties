# ==========================================
# SkyGuard Aviation Operations Configuration
# ==========================================
spring.application.name=SkyGuard
server.port=8080

# Database Configuration (MySQL 8.x)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aviation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AI Operations Copilot Configuration (Optional Cloud API)
ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}

# Logging configuration
logging.level.com.example.skyguard=INFO
logging.level.org.springframework.security=INFO
